# routing.yaml — Claude token router configuration
# Edit this to retune routing without touching router.py.
# Verify pricing against the official pricing page before trusting cost output.

version: 2
updated: 2026-09-21
# Verified 2026-09-21 against platform.claude.com models overview + Sonnet 5
# pricing announcement. Three corrections vs v1 (see CHANGELOG at end of file).

# ---------------------------------------------------------------------------
# Models: ids, per-MTok pricing, and cache/batch multipliers.
# All prices USD per million tokens.
# NOTE: output is 5x input on every current tier EXCEPT Sonnet 5 ($2/$10 is
# also 5x — still holds). Do not assume the ratio when adding a model; look it
# up. `cache_read_mult` overrides the global multiplier per model.
# ---------------------------------------------------------------------------
models:
  haiku:
    id: claude-haiku-4-5
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    context_tokens: 200000
    max_output_tokens: 64000
    # Haiku 4.5 does NOT support output_config.effort — passing it errors.
    # It also still uses OLD-STYLE extended thinking (thinking.budget_tokens),
    # not adaptive thinking. Do not copy Opus/Sonnet request shapes onto it.
    effort_supported: false
    thinking_mode: extended_budget_tokens

  sonnet:
    # $2/$10 is the PERMANENT rate. The scheduled 2026-09-01 reversion to
    # $3/$15 was CANCELLED on 2026-08-10 — introductory pricing was made
    # standard. v1 of this file hardcoded $3/$15 defensively against that
    # reversion; that defense is now obsolete and overstated Sonnet by 50%.
    id: claude-sonnet-5
    input_per_mtok: 2.00
    output_per_mtok: 10.00
    context_tokens: 1000000
    max_output_tokens: 128000
    effort_supported: true      # low|medium|high|xhigh|max, default high
    thinking_mode: adaptive
    # Sonnet 5 uses a NEW TOKENIZER: 1.0-1.35x more tokens for the same text.
    # Re-benchmark cache-hit rates and token counts before migrating cached
    # prefix workloads onto it. See references/integration.md.
    tokenizer_note: new_tokenizer_1.0x_to_1.35x

  sonnet_4_6:
    # LEGACY pin. Old tokenizer, known-stable token counts. Note it is now
    # MORE expensive than Sonnet 5 ($3/$15 vs $2/$10) — pin it only for
    # token-count stability, never for cost.
    id: claude-sonnet-4-6
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    context_tokens: 1000000
    status: legacy

  opus:
    # Was claude-opus-4-8 in v1. Opus 5 is the current Opus-tier model at the
    # SAME price, so this retarget changes no cost math — only the model ID.
    id: claude-opus-5
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    context_tokens: 1000000
    max_output_tokens: 128000
    effort_supported: true      # low|medium|high|xhigh|max, default high
    thinking_mode: adaptive     # ON BY DEFAULT (unlike Opus 4.8/4.7)
    # Fast mode (speed:"fast", beta) reprices Opus 5 to $10/$50 — 2x. It is
    # NOT modelled here. If you enable it, you are paying Fable rates.

  opus_4_8:
    # LEGACY pin — the v1 opus target. Same price as Opus 5.
    id: claude-opus-4-8
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    context_tokens: 1000000
    status: legacy

  fable:
    # Frontier tier. Retargeted from claude-fable-5 to claude-fable-5-1 (the
    # current frontier model) at the SAME per-token price.
    # Reserve for work where the extra capability materially changes the
    # OUTCOME; at $10/$50 a misroute here is the single most expensive
    # mistake the router can make.
    id: claude-fable-5-1
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    context_tokens: 1000000
    max_output_tokens: 128000
    # Cache reads on Fable 5.1 are 2.5% of base input ($0.25/MTok), NOT the
    # usual 10%. The global multiplier would overstate this by 4x.
    cache_read_mult: 0.025
    thinking_mode: always_on    # omit `thinking`; explicit config returns 400
    # API differences that will break a shared request builder:
    #   - forced tool_choice ("any"/"tool") returns 400 — use "auto"
    #   - no assistant prefill
    #   - requires 30-day retention; ZDR orgs get 400 unless authorized
    #   - no Priority Tier
    # Mythos 5.1 shares the model but is trusted-access only (Project
    # Glasswing). Do not route to it by default.

  fable_5:
    # LEGACY pin. Standard 10% cache reads, unlike 5.1.
    id: claude-fable-5
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    context_tokens: 1000000
    status: legacy

# Multipliers applied to base input price. These stack with batch.
# A model may override cache_read via its own `cache_read_mult` (Fable 5.1).
multipliers:
  cache_read: 0.10      # cache hit: 90% off input (default; per-model override)
  cache_write_5m: 1.25  # 5-minute TTL write
  cache_write_1h: 2.00  # 1-hour TTL write
  batch: 0.50           # 50% off input AND output, async (<=24h)

# Escalation order. Router walks up this ladder on failed validation.
# fable sits above opus. Escalation is capped by escalation.max_escalations
# (default 1), so a haiku task will NOT silently walk all the way to fable —
# that would be an expensive surprise. Fable is normally reached by explicit
# routing (signals / role), not by escalation drift.
tier_order: [haiku, sonnet, opus, fable]

# ---------------------------------------------------------------------------
# Routing rules. The classifier scores a task against these and picks a tier.
# 'signals' are substrings/keywords matched case-insensitively against the
# task descriptor. First tier whose signals match (checked low->high) wins,
# unless an 'escalate_if' condition fires. Tune freely.
# ---------------------------------------------------------------------------
rules:
  haiku:
    description: Deterministic, pattern-based, low-ambiguity work.
    signals:
      - extract
      - parse
      - regex
      - reformat
      - convert
      - json to
      - yaml
      - classify
      - tag
      - label
      - validate
      - lint
      - summarize
      - dedupe
      - filter
      - normalize
    use_for:
      - log/field extraction
      - format conversion
      - clear-label classification
      - syntax/schema validation
      - high-volume swarm worker subtasks

  sonnet:
    description: Applied reasoning with a known approach. The default workhorse.
    signals:
      - write
      - code
      - endpoint
      - function
      - script
      - implement
      - debug
      - fix
      - refactor
      - build
      - generate
      - query
      - map to
      - draft
      - email
      - rewrite
      - explain
      - orchestrate
      - synthesize
      - lab
      - step-by-step
    use_for:
      - code generation and debugging
      - multi-step instructions
      - query/rule writing
      - standard professional writing
      - agent orchestration and tool loops
      - few-source research synthesis

  opus:
    description: Novel design, adversarial reasoning, or high-stakes correctness.
    signals:
      - architect
      - design from scratch
      - novel
      - strategy
      - adversarial
      - red team
      - tradeoff
      - compliance
      - high stakes
      - critical
      - review before ship
      - final review
      - reason about
      - prove
    use_for:
      - system design from scratch
      - adversarial/creative reasoning
      - multi-framework tradeoff reasoning
      - expensive-if-wrong decisions
      - final review of lower-tier output

  fable:
    description: >
      Frontier tier ($10/$50 — 2x Opus input, 2x Opus output). Only for work
      where the extra capability materially changes the OUTCOME, not merely the
      polish. If an Opus retry would plausibly get there, use Opus. Requires an
      explicit signal or role; never the default.
    signals:
      - fable
      - frontier
      - hardest
      - deepest reasoning
      - long-horizon
      - flagship
      - escalate to fable
      - highest tier
    use_for:
      - long-horizon autonomous agent runs where drift is costly
      - genuinely novel research/architecture with no known approach
      - final gate on decisions that are expensive and irreversible
    guardrail: >
      A misroute here is the most expensive mistake the router can make.
      Log every fable call. If a fable call would not have changed the decision
      versus opus, that is a routing bug — tighten these signals.

# Default when nothing matches confidently.
default_tier: sonnet

# ---------------------------------------------------------------------------
# Escalation: confidence-gated retry. After a call, the caller reports a
# validation result and/or a confidence score. If validation fails or
# confidence < threshold, the router escalates one tier and retries.
# ---------------------------------------------------------------------------
escalation:
  enabled: true
  max_escalations: 1          # one retry up the ladder; raise with caution
  confidence_threshold: 0.6   # below this -> escalate
  # If a task already routes to opus, there is no higher tier; it returns as-is.

# ---------------------------------------------------------------------------
# Caching policy. The router builds a cached prefix block from these parts.
# Anything listed here should be byte-stable across calls or the cache misses.
# ---------------------------------------------------------------------------
caching:
  enabled: true
  ttl: 5m                      # 5m for tight loops; 1h for long-lived context
  cache_parts:                 # logical names; caller supplies the actual text
    - system_prompt
    - tool_definitions
    - persistent_context       # scope files, standing instructions
  min_cacheable_tokens: 1024   # below this, caching write overhead isn't worth it

# ---------------------------------------------------------------------------
# Batch policy. Route eligible work async for 50% off. Stacks with caching.
# ---------------------------------------------------------------------------
batch:
  enabled: true
  # Task descriptors matching these are batch-eligible (latency-tolerant).
  eligible_signals:
    - nightly
    - backfill
    - bulk
    - batch
    - report
    - sweep
    - offline
    - async
  max_latency_ok_hours: 24

# ---------------------------------------------------------------------------
# Swarm policy. Role-based overrides for multi-agent setups.
# ---------------------------------------------------------------------------
swarm:
  roles:
    planner: opus         # or sonnet for cheaper orchestration
    orchestrator: sonnet
    worker: haiku         # repetitive fan-out grunts
    reviewer: opus        # final-pass quality gate
    final_arbiter: fable  # ONLY for irreversible/expensive calls. Use sparingly.

# ---------------------------------------------------------------------------
# Cost guardrails. Fable is 10x haiku on input and 10x on output — a runaway
# loop here is the failure mode that actually hurts. These are advisory limits
# the router surfaces; enforce them in your orchestrator.
# ---------------------------------------------------------------------------
cost_guards:
  # Warn if a single call's estimated cost exceeds this (USD).
  warn_above_usd_per_call: 0.50
  # Hard-stop tiers that should never be reached by escalation drift alone.
  require_explicit_routing: [fable]
  # Log every call at these tiers for later audit.
  audit_tiers: [opus, fable]

# ---------------------------------------------------------------------------
# Effort — the first quality-trading lever AFTER caching, and cheaper to reach
# for than a tier change. Not modelled in router.py's cost estimate (effort
# changes token VOLUME, not per-token price), but it belongs in the routing
# decision: the newest model at LOW effort often beats a prior-generation
# model at HIGH effort, for one cache namespace instead of two.
# Haiku 4.5 does not support effort at all.
# ---------------------------------------------------------------------------
effort:
  default: high          # matches the API default on Opus 5 / Sonnet 5 / Fable
  by_role:
    worker: low          # subagents, bulk extraction, simple fan-out
    orchestrator: medium
    planner: high
    reviewer: xhigh      # best setting for most coding/agentic work
    final_arbiter: max   # correctness matters more than cost
  guidance: >
    Measure before raising a default — effort repays strongly on coding and
    long-horizon agentic work, and often not at all on chat, classification,
    or high-volume latency-sensitive routes. Tune per route, not globally.
    Judge cost per COMPLETED TASK, not per request: a cheaper call that needs
    more turns to finish the job is not cheaper.

# ---------------------------------------------------------------------------
# Cache-namespace warning. This is a structural cost of tier routing itself
# and the single most important caveat in this file.
# ---------------------------------------------------------------------------
cache_namespace:
  # Prompt caches are MODEL-SCOPED. Every tier hop is a guaranteed cache miss
  # on the shared prefix — the routed call pays full input price to rebuild a
  # prefix the previous tier already had cached.
  model_scoped: true
  warning: >
    A multi-model cascade FORFEITS cache reuse across its models. On an
    input-heavy agent loop, the cache you lose by hopping tiers can exceed
    the per-token spread you gained by hopping. Before adding a tier hop to
    save money, measure the simpler alternative first: ONE model at lower
    effort, keeping a single warm cache namespace.
    Corollary: a mid-conversation top-level `effort` change also invalidates
    the messages cache. On Opus 5 / Fable 5.1, use the per-message effort
    system message to change effort WITHOUT a cache reset.
  # Check this before trusting any savings number from cost_report.py.
  verify_with: usage.cache_read_input_tokens

